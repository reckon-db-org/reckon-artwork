<svg viewBox="0 0 210 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ReckonDB">
  <defs>
    <!-- Brand-purple sphere gradient (light from upper-left) -->
    <radialGradient id="sphereGradient" cx="0.32" cy="0.30" r="0.75">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="35%" stop-color="#8B5CF6" />
      <stop offset="70%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#5B21B6" />
    </radialGradient>

    <!-- Specular highlight -->
    <radialGradient id="sphereHighlight" cx="0.28" cy="0.26" r="0.4">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Sphere mark -->
  <circle cx="30" cy="30" r="24" fill="url(#sphereGradient)" />
  <ellipse cx="22" cy="22" rx="10" ry="8" fill="url(#sphereHighlight)" />
  <ellipse cx="20" cy="20" rx="4" ry="3" fill="#FFFFFF" opacity="0.55" />

  <!-- Eye of Horus on the sphere surface -->
  <g stroke="#B8E234" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"
     opacity="0.95" transform="scale(1.2) translate(-2, -3)">
    <path d="M24 24 Q28 19 33 24 Q38 19 42 24 Q38 29 33 24 Q28 29 24 24 Z"/>
    <path d="M25 19 Q33 16 41 19"/>
    <circle cx="33" cy="24" r="2.2" fill="#B8E234"/>
    <path d="M30 29 Q28 31 28 34 Q28 36 30 36 Q32 34 30 29"/>
    <path d="M42 24 Q44 26 42 28 Q40 30 38 28 Q40 26 42 24"/>
    <path d="M38 28 Q38 32 39 36"/>
    <path d="M34 31 Q34 35 35 39"/>
    <path d="M26 27 Q24 29 23 32"/>
  </g>

  <!-- Subtle surface curvature lines -->
  <ellipse cx="28" cy="21" rx="10" ry="8" fill="none" stroke="#B8E234" stroke-width="0.6" opacity="0.30"
           stroke-dasharray="1,4" transform="rotate(-10 28 21) scale(1.2)"/>

  <!-- Wordmark -->
  <text x="66" y="34" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700"
        letter-spacing="-0.3" fill="#1E1B2E">ReckonDB</text>

  <!-- Tagline -->
  <text x="67" y="46" font-family="'Source Sans Pro', system-ui, sans-serif" font-size="7"
        letter-spacing="1.55" fill="#7C3AED" font-weight="600">EVENT SOURCING DATABASE</text>
</svg>
