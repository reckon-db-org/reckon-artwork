<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sphere gradient for 3D effect -->
    <radialGradient id="sphereGradient" cx="0.32" cy="0.30" r="0.75">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="35%" stop-color="#8B5CF6" />
      <stop offset="70%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#5B21B6" />
    </radialGradient>
    
    <!-- Enhanced sphere highlight -->
    <radialGradient id="sphereHighlight" cx="0.25" cy="0.25" r="0.3">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- 3D Sphere background -->
  <circle cx="16" cy="16" r="16" fill="url(#sphereGradient)"/>
  
  <!-- Sphere highlight for 3D effect -->
  <ellipse cx="11" cy="11" rx="8" ry="6" fill="url(#sphereHighlight)" />
  
  <!-- Additional small highlight for extra shine -->
  <ellipse cx="10" cy="10" rx="3" ry="2" fill="#FFFFFF" opacity="0.4" />
  
  <!-- Eye of Horus symbol -->
  <g stroke="#B8E234" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none"
     style="opacity: 0.95;" transform="translate(-8.5, -8.5) scale(0.9)">
    <!-- Main eye shape -->
    <path d="M24 24 Q28 19 33 24 Q38 19 42 24 Q38 29 33 24 Q28 29 24 24 Z"/>
    <!-- Eyebrow line -->
    <path d="M25 19 Q33 16 41 19"/>
    <!-- Pupil -->
    <circle cx="33" cy="24" r="2" fill="#B8E234"/>
    <!-- Teardrop marking below -->
    <path d="M30 29 Q28 31 28 34 Q28 36 30 36 Q32 34 30 29"/>
    <!-- Spiral curl extending from corner -->
    <path d="M42 24 Q44 26 42 28 Q40 30 38 28 Q40 26 42 24"/>
    <!-- Decorative lines -->
    <path d="M38 28 Q38 32 39 36"/>
    <path d="M34 31 Q34 35 35 39"/>
    <!-- Additional traditional markings -->
    <path d="M26 27 Q24 29 23 32"/>
  </g>
  
  <!-- Surface texture overlay -->
  <ellipse cx="16" cy="16" rx="5" ry="4" fill="none" stroke="#B8E234" stroke-width="0.3" opacity="0.35"
           stroke-dasharray="1,2" transform="rotate(-10 16 16)"/>
</svg>
